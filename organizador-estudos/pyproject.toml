[project]
name = "organizador-estudos"
version = "1.0.0"
description = "Aplicação CLI para organização de tarefas de estudo, voltada a estudantes com dificuldade de rotina."
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Leonardo C. P. H."}
]

[project.scripts]
organizador = "src.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 95
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
